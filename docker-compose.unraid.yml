# Test deployment on Unraid (or any Docker host): app + PostgreSQL. Put HTTPS in front (see docs/unraid.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: np
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: np
    volumes:
      - ${APPDATA:-/mnt/user/appdata/neighbourhood}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U np -d np"]
      interval: 10s
      retries: 10

  app:
    # Pulled from GitHub Container Registry (built by .github/workflows/publish-image.yml).
    # Set NP_IMAGE in .env, e.g. ghcr.io/<your-github-user>/neighbourhood-platform:latest
    image: ${NP_IMAGE:?set NP_IMAGE in .env}
    pull_policy: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://np:${PG_PASSWORD}@db:5432/np
      DATABASE_SSL: "off"
      APP_BASE_URL: ${APP_BASE_URL:?public https URL, e.g. https://np.example.com}
      WATCHTOWER_SECRET: ${WATCHTOWER_SECRET:-}
      HA_URL: ${HA_URL:-}                      # Air tab (optional): Home Assistant address reachable from this container, e.g. http://192.168.1.20:8123
      HA_TOKEN: ${HA_TOKEN:-}
      HA_AIR_SENSORS: ${HA_AIR_SENSORS:-}
      HA_STALE_MINUTES: ${HA_STALE_MINUTES:-120}   # how old an AirCon reading may be before it is shown as old (battery Zigbee sensors can go 55 min between updates)
      JWT_SECRET: ${JWT_SECRET:?}
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
      DEFAULT_COMMUNITY_NAME: ${COMMUNITY_NAME:-Pilot Community}
      MGMT_EMAIL: ${MGMT_EMAIL:-test-inbox@example.com}   # use YOUR OWN address while testing, never the management company's
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}      # console = print emails in the log; smtp to really send
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /data/files
      COOKIE_SECURE: ${COOKIE_SECURE:-}               # set false ONLY for plain-http LAN testing; leave blank behind HTTPS
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-true}
    volumes:
      - ${APPDATA:-/mnt/user/appdata/neighbourhood}/files:/data/files

  # Checks every 5 minutes for a new image on GitHub and restarts only the app container when one appears.
  watchtower:
    image: nickfedor/watchtower:latest   # maintained fork of containrrr/watchtower; verify the image name before use
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      # Sends each update notice to the app so you can read it on Admin > System (no Docker access needed)
      WATCHTOWER_NOTIFICATIONS: shoutrrr
      WATCHTOWER_NOTIFICATION_URL: "generic+http://app:8080/api/inbound/watchtower?template=json&@X-Watchtower-Secret=${WATCHTOWER_SECRET:-unset}"
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      # Needed only for a private repo/package: mounted docker login below
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA:-/mnt/user/appdata/neighbourhood}/docker-config.json:/config.json:ro
